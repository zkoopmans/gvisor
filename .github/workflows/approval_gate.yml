# Enforces the maintainer approval rule (GOVERNANCE.md, agreed 2026-11-16):
# a maintainer's pull request needs one approving review from another
# maintainer; anyone else's needs two. Published as the commit status
# `approvals/maintainer-rule`, which the master ruleset requires.
#
# Two triggers, because a review on a fork PR runs with a read-only token:
#   - pull_request_target (opened / synchronize / ready): evaluates directly.
#   - workflow_run of "Approval gate (review)": that workflow fires on every
#     review and only records the PR number; this one re-evaluates with the
#     base repository's token.
# Neither path checks out or runs pull request content; the roster is read
# from the base branch and reviews come from the API.
name: Approval gate

"on":
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Approval gate (review)"]
    types: [completed]

permissions:
  contents: read
  statuses: write
  pull-requests: read
  actions: read

concurrency:
  group: approval-gate-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.repository == 'gvisor/gvisor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout base branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      run: npm install js-yaml

    - name: Find pull request number (review path)
      if: github.event_name == 'workflow_run'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: pr-number
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Evaluate
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |-
          const fs = require('fs');
          let prNumber;
          if (context.eventName === 'workflow_run') {
            prNumber = parseInt(fs.readFileSync('pr-number.txt', 'utf8').trim(), 10);
          }
          const gate = require('./.github/workflows/approval_gate.js');
          await gate({ github, context, core, prNumber });
