# This workflow holds pull requests at the floor and, once they clear it,
# assigns reviewers. Both halves are governance/tools/funnel.
#
# The floor is what a pull request must have before anyone is asked to read
# it: a description in the author's words and an `Assisted-by:` line
# (`Assisted-by: none` is valid). A pull request that lacks them gets a label
# and one comment to the author, and no reviewer is requested. The floor is
# never a required check and never blocks a merge.
#
# Rollout: the floor only holds when the repository variable FLOOR_ENFORCE is
# "true". Otherwise it reports in the job summary and reviewers are assigned
# as before.
name: Auto Assign

"on":
  # Requesting reviewers on fork PRs requires a write token. Checkout uses
  # the trusted base branch; the funnel reads PR metadata through the API
  # and treats it as data, never as executable code.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, ready_for_review, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

# One run per pull request at a time; a new edit or push restarts the floor
# and the assignment delay.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  floor:
    name: floor
    if: >-
      github.event.pull_request.draft == false &&
      (github.repository == 'gvisor/gvisor' || vars.FUNNEL_TEST == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write  # label, comment
      issues: write         # create the label if it does not exist
    outputs:
      verdict: ${{ steps.floor.outputs.verdict }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: Check the floor
      id: floor
      env:
        GITHUB_TOKEN: ${{ github.token }}
        FLOOR_ENFORCE: ${{ vars.FLOOR_ENFORCE }}
      run: go run ./governance/tools/funnel floor

  assign:
    name: assign
    needs: floor
    if: >-
      needs.floor.outputs.verdict == 'assign' &&
      (github.repository == 'gvisor/gvisor' || vars.FUNNEL_TEST == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: Assign reviewers
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: go run ./governance/tools/funnel assign
