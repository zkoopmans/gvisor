# gVisor specialization areas.
#
# Each area maps a name to the set of repository paths that it covers.
#
# Area fields:
#   name:             Area name. Areas must be sorted by name.
#   enforced_review:  Whether the area gets a CODEOWNERS section, making review
#                     by one of its approvers mandatory. Requires at least one
#                     owner and one approver. Set for two reasons: the area is
#                     security- or release-sensitive and its approver list is
#                     deliberately short (seccomp, release_pipeline), or its
#                     owners have confirmed the list and landed the area's
#                     STANDARDS.md. Sensitive areas do not widen by default.
#   owners:           Sorted GitHub usernames of the maintainers accountable
#                     for the area: they curate its approvers and write its
#                     standards. Must be a subset of approvers.
#   approvers:        Sorted GitHub usernames of the non-emeritus maintainers
#                     who review and approve changes in the area. The reviewer
#                     assigner routes pull requests to the active ones.
#   paths:            Repo-root-relative paths (each starting with a slash,
#                     no trailing slash) covered by the area, and everything
#                     beneath them. The last segment may contain `*`, which
#                     matches within that segment only (never `/`), so
#                     `/test/syscalls/linux/socket_*` covers the socket tests
#                     without claiming the directory. Areas nest: a file is
#                     routed to the most specific (longest) matching path.
areas:
  - name: benchmarks
    enforced_review: false
    owners: [zkoopmans]
    approvers: [aaltinaydev, etienneperot, riverafernando, zkoopmans]
    paths:
